[package]
name = "scbr"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Fast, local, multi-language code sloppiness metrics"
license = "Apache-2.0"
keywords = ["static-analysis", "metrics", "tree-sitter", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.11"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
tree-sitter = "=0.27.0"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
